version: '3.9'

services:
  server:
    build: ./server
    container_name: express-server
    ports:
      - "4000:4000"
    networks:
      - full-stack-deploy
    environment:
      - NODE_ENV=prod
    restart: unless-stopped
  client:
    build: ./client
    container_name: react-client
    ports:
      - "5174:3000"
    networks:
      - full-stack-deploy
    depends_on:
      - server
    restart: unless-stopped

networks:
  full-stack-deploy:
    driver: bridge